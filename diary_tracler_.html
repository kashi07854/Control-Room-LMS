<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06080f;--card:rgba(255,255,255,.04);--bd:rgba(255,255,255,.09);--tx:#e8edf7;--mut:#8b97ad;--a1:#7c5cff;--a2:#22d3ee;--good:#34d399;--warn:#fbbf24;--bad:#fb7185}

.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh;position:relative;z-index:1}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px;border-right:1px solid var(--bd);background:linear-gradient(180deg,rgba(10,13,23,.85),rgba(6,8,15,.7));backdrop-filter:blur(18px);z-index:40}

.spacer{flex:1}

</style>

function todayISO(){return new Date().toISOString().slice(0,10)}
function getISOWeek(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const target=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=target.getUTCDay()||7;
  target.setUTCDate(target.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(target.getUTCFullYear(),0,1));
  const weekNo=Math.ceil((((target-yearStart)/86400000)+1)/7);
  return `${target.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
}
function getWeekRange(weekKey){
  const [year,week]=weekKey.split('-W').map(Number);
  const jan4=new Date(Date.UTC(year,0,4));
  const jan4Day=jan4.getUTCDay()||7;
  const monday=new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate()-(jan4Day-1)+(week-1)*7);
  const sunday=new Date(monday);sunday.setUTCDate(monday.getUTCDate()+6);
  const fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  return `${fmt(monday)} – ${fmt(sunday)} ${sunday.getFullYear()}`;
}
function renderDiaryPreview(date){
  const e=g(`journal.entries.${date}`)||{};
  const d=new Date(date+'T00:00:00');
  const dateStr=d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  const gratLines=[];for(let i=1;i<=5;i++){const t=e['grat'+i];if(t)gratLines.push(t)}
  const hasContent=e.morning||e.acc||e.learn||gratLines.length||e.evening||e.notes;
  if(!hasContent){
    return `<div class="diary-empty"><div class="ico">📔</div><p>Start typing to see your diary preview here...</p><p style="margin-top:6px;font-size:11.5px">Your entry will auto-format like a real diary.</p></div>`;
  }
  let html=`<div class="diary-header"><div class="lbl">Diary Entry</div><div class="d">${dateStr}</div></div>`;
  const secs=[['🌅 MORNING THOUGHTS','morning'],['🎯 WHAT I ACCOMPLISHED','acc'],['📚 WHAT I LEARNED','learn']];
  secs.forEach(([label,key])=>{if(e[key])html+=`<div class="diary-section"><div class="hdr">${label}</div><div class="txt">${esc(e[key])}</div></div>`});
  if(gratLines.length){html+=`<div class="diary-section"><div class="hdr">🙏 GRATITUDE</div><div class="grat">${gratLines.map((l,i)=>`<div>${i+1}. ${esc(l)}</div>`).join('')}</div></div>`}
  if(e.evening)html+=`<div class="diary-section"><div class="hdr">🌙 EVENING REFLECTION</div><div class="txt">${esc(e.evening)}</div></div>`;
  if(e.notes)html+=`<div class="diary-section"><div class="hdr">💡 NOTES</div><div class="txt">${esc(e.notes)}</div></div>`;
  return html;
}

function exportToExcel(filename,rows){
  const htmlEsc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>th{background:#7c5cff;color:#fff;padding:8px;font-weight:bold;border:1px solid #444;font-family:Arial;font-size:11px}td{padding:6px;border:1px solid #ccc;vertical-align:top;white-space:pre-wrap;font-family:Arial;font-size:11px}</style></head><body><table>`;
  rows.forEach((row,idx)=>{const tag=idx===0?'th':'td';html+='<tr>'+row.map(c=>`<${tag}>${htmlEsc(c)}</${tag}>`).join('')+'</tr>'});
  html+='</table></body></html>';
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

const NAV_GROUPS=[
  {label:'Overview',items:[['dashboard','🏠','Dashboard','Overview']]},
  {label:'Daily Practice',items:[['journal','📔','Journal','Diary'],['today','📅','Today','Daily plan'],['week','📆','Week','Schedule & review']]},
  {label:'Trackers',items:[['college','🎓','College','Amity subjects'],['learning','📚','Learning','Skills & knowledge'],['revision','🔄','Revision','Spaced repetition'],['health','💪','Health','Weight, water, gym'],['food','🍽️','Food','Meals & calories'],['money','💰','Money','Income & expenses'],['ceo','👑','CEO','Skills & mindset'],['goals','🎯','Goals','Monthly & yearly']]},
  {label:'System',items:[['settings','⚙️','Settings','Configuration']]}
];
const NAV=NAV_GROUPS.flatMap(g=>g.items);
const VIEWS={dashboard:viewDashboard,journal:viewJournal,today:viewToday,week:viewWeek,college:viewCollege,learning:viewLearning,revision:viewRevision,health:viewHealth,food:viewFood,money:viewMoney,ceo:viewCEO,goals:viewGoals,settings:viewSettings};
let current='dashboard';
function buildNav(){let h='';NAV_GROUPS.forEach(grp=>{h+=`<div class="nav-group">${grp.label}</div>`;grp.items.forEach(([id,ico,l])=>{h+=`<a data-view="${id}" class="${id===current?'active':''}"><i>${ico}</i>${l}</a>`})});document.getElementById('nav').innerHTML=h}
function render(){const v=VIEWS[current];document.getElementById('view').innerHTML=v?v():'';const item=NAV.find(n=>n[0]===current);document.getElementById('crumb').firstChild.textContent=item?item[2]:'';document.getElementById('crumbSub').textContent=item?item[3]:'';document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===current));window.scrollTo({top:0,behavior:'instant'});if(current==='learning')attachFolderSearch()}
function go(v){current=v;render();document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}

// --- BACKEND SYNC LOGIC ---
async function syncToBackend() {
    try {
        const res = await fetch('/api/sync_diary', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(state)
        });
        const data = await res.json();
        if (data.ok) toast('✅ Diary synced to server!');
        else toast('❌ Sync failed: ' + (data.error || 'Unknown error'));
    } catch (e) {
        toast('❌ Server not reachable (check Flask)');
    }
}

async function generateServerReport() {
    try {
        toast('⏳ Generating report...');
        const res = await fetch('/api/generate_report', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({...state, type: 'Manual'})
        });
        const data = await res.json();
        if (data.ok) {
            toast('✅ Report generated successfully!');
            // Optionally open the file folder or download
        } else {
            toast('❌ Report failed: ' + (data.error || 'Unknown error'));
        }
    } catch (e) {
        toast('❌ Server not reachable');
    }
}

document.addEventListener('click',e=>{
  const n=e.target.closest('[data-view]');if(n){go(n.dataset.view);return}
  const gb=e.target.closest('[data-go]');if(gb){go(gb.dataset.go);return}
  const jt=e.target.closest('[data-jtab]');if(jt){s('journalUI.tab',jt.dataset.jtab);render();return}
  const oe=e.target.closest('[data-openentry]');if(oe){s('journalUI.tab','write');s('journalUI.date',oe.dataset.openentry);render();return}
  const ew=e.target.closest('[data-exportweek]');if(ew){exportWeekExcel(ew.dataset.exportweek);return}
  
  if(e.target.id==='exportAllBtn'||e.target.id==='exportJournalAllBtn'){exportAllExcel();return}
  if(e.target.id==='syncBackendBtn'){syncToBackend();return}
  if(e.target.id==='serverReportBtn'){generateServerReport();return}
  
  if(e.target.id==='journalSaveBtn'){s('journalUI.tab','weekly');toast('✅ Entry saved — viewing weekly archive');render();return}
  if(e.target.id==='journalExportBtn'){const d=g('journalUI.date')||todayISO();exportToExcel(`diary-${d}.xls`,[JOURNAL_HEADERS,journalRowForDate(d)]);toast('✅ Entry exported');return}
  const b=e.target.closest('.chk[data-k]');if(b){const p=b.dataset.k;const val=!g(p);s(p,val);b.classList.toggle('on',val);b.textContent=val?'✓':'';clearTimeout(b._r);b._r=setTimeout(()=>render(),220);return}
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.range){const p=t.dataset.range;const v=Number(t.value);s(p,v);const out=document.querySelector(`.rngval[data-for="${p}"]`);if(out)out.textContent=v;return}
  if(t.matches('[data-k]')&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')){
    const p=t.dataset.k;
    s(p,t.type==='number'?(t.value===''?'':Number(t.value)):t.value);
    if(p.startsWith('journal.entries.')){
      const preview=document.getElementById('diaryPreview');
      if(preview){const date=g('journalUI.date')||todayISO();preview.innerHTML=renderDiaryPreview(date)}
    }
  }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='journalDateInput'){s('journalUI.date',t.value);render();return}
  if(t.matches('[data-k]')&&t.type==='number'){
    const p=t.dataset.k;
    if(p.startsWith('money.')||p.startsWith('learning.mod')||p.startsWith('goals.m')||p.startsWith('goals.y')||p.startsWith('food.')||p.startsWith('health.w')||p.startsWith('college.prog'))render();
  }
});

document.getElementById('menuBtn').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')};
document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')};
function tickClock(){const n=new Date();document.getElementById('clock').innerHTML=`<b>${n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}</b>${n.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}`}
setInterval(tickClock,1000);tickClock();
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mylife-os-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);toast('✅ Backup downloaded')}
document.getElementById('exportBtn').onclick=exportData;
document.getElementById('importBtn').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{state=JSON.parse(ev.target.result);localStorage.setItem(KEY,JSON.stringify(state));render();toast('✅ Data imported')}catch(err){toast('❌ Invalid file')}};r.readAsText(f);e.target.value=''};
document.addEventListener('click',e=>{if(e.target.id==='expBtn2')exportData();if(e.target.id==='impBtn2')document.getElementById('fileIn').click();if(e.target.id==='resetBtn'){if(confirm('Reset ALL data? Cannot be undone.')){localStorage.removeItem(KEY);state={};render();toast('🗑️ Data reset')}}});
function attachFolderSearch(){const i=document.getElementById('folderSearch');if(!i)return;i.oninput=()=>{const q=i.value.toLowerCase().trim();document.querySelectorAll('#folderTree .tree-row').forEach(r=>{r.style.display=(!q||r.dataset.name.includes(q))?'':'none'})}}
let pomo={left:25*60,running:false,id:null};
function pomoRender(){const el=document.getElementById('pomoT');if(!el)return;const m=Math.floor(pomo.left/60),sec=pomo.left%60;el.textContent=`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
document.addEventListener('click',e=>{if(e.target.id==='pomoStart'){const btn=e.target;if(pomo.running){clearInterval(pomo.id);pomo.running=false;btn.textContent='Start'}else{pomo.running=true;btn.textContent='Pause';pomo.id=setInterval(()=>{pomo.left--;if(pomo.left<=0){clearInterval(pomo.id);pomo.running=false;pomo.left=25*60;const b=document.getElementById('pomoStart');if(b)b.textContent='Start';toast('⏰ 25 min done — take a 5 min break!')}pomoRender()},1000)}}if(e.target.id==='pomoReset'){clearInterval(pomo.id);pomo.running=false;pomo.left=25*60;const b=document.getElementById('pomoStart');if(b)b.textContent='Start';pomoRender()}});
buildNav();render();
</script>
