{% extends "base.html" %}
{% block breadcrumbs %}Workspace / Local AI{% endblock %}
{% block body %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="h4 mb-0 fw-bold"><i class="bi bi-robot text-primary me-2"></i>Local AI Chat</h2>
  <div class="d-flex align-items-center gap-2">
    <span class="text-muted" style="font-size: 12px;">Powered by Ollama</span>
    <select id="modelSelect" class="form-select form-select-sm" style="width: 150px;">
      <option value="llama3">Llama 3</option>
      <option value="phi3">Phi-3</option>
    </select>
  </div>
</div>

<div class="ai-container">
  <div class="ai-chat-box" id="chatBox">
    <div class="ai-message ai-bot">
      <div class="ai-avatar"><i class="bi bi-robot"></i></div>
      <div class="ai-text">Hello! Main aapki local files padh sakta hoon. Kisi bhi PDF, Word, ya Excel file ko attach karke uske baare me sawal poocho.</div>
    </div>
  </div>
  
  <div id="selectedFileBadge" class="mx-3 mb-2" style="display:none;">
    <span class="badge bg-primary d-flex align-items-center gap-2 p-2" style="width: fit-content;">
      <i class="bi bi-file-earmark-text"></i> <span id="fileName"></span>
      <i class="bi bi-x-circle" style="cursor:pointer;" onclick="clearFile()"></i>
    </span>
  </div>

  <div class="ai-input-area">
    <button class="btn btn-outline-secondary" onclick="openFileModal()" title="Attach File"><i class="bi bi-paperclip"></i></button>
    <textarea id="aiInput" rows="1" placeholder="Ask something about the file..." onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
    <button class="btn btn-primary" onclick="sendMessage()" id="sendBtn">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>

<!-- Custom Modal (No Bootstrap) -->
<div id="fileModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; backdrop-filter: blur(4px);">
  <div style="background:#1e293b; width:90%; max-width:600px; border-radius:12px; border:1px solid #334155; overflow:hidden; display:flex; flex-direction:column; max-height: 80vh;">
    
    <div style="padding:16px; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center;">
      <h5 style="margin:0; color:#fff; font-weight:bold;"><i class="bi bi-folder2-open me-2"></i>Select File</h5>
      <button type="button" onclick="closeFileModal()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer; line-height: 1;">&times;</button>
    </div>
    
    <div style="padding:16px; border-bottom:1px solid #334155;">
      <input type="text" id="fileSearch" class="form-control bg-dark text-white border-secondary" placeholder="Search files..." oninput="filterFiles()">
    </div>
    
    <div id="fileListContainer" style="overflow-y:auto; flex:1; padding:0;">
      <!-- List will be loaded here -->
    </div>
    
  </div>
</div>

<style>
  .ai-container { height: calc(100vh - 230px); display: flex; flex-direction: column; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .ai-chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  .ai-message { display: flex; gap: 12px; max-width: 85%; }
  .ai-user { align-self: flex-end; flex-direction: row-reverse; }
  .ai-avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .ai-bot .ai-avatar { background: rgba(124, 92, 255, 0.15); color: #7c5cff; }
  .ai-user .ai-avatar { background: rgba(34, 211, 238, 0.15); color: #22d3ee; }
  .ai-text { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; color: var(--text-main); white-space: pre-wrap; }
  .ai-user .ai-text { background: rgba(34, 211, 238, 0.08); border-color: rgba(34, 211, 238, 0.2); }
  .ai-input-area { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: rgba(0, 0, 0, 0.2); }
  .ai-input-area textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text-main); font-family: inherit; font-size: 14px; resize: none; outline: none; }
  .ai-input-area textarea:focus { border-color: #7c5cff; box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2); }
  .typing { display: inline-block; width: 20px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  
  .file-row { padding: 12px 16px; border-bottom: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #cbd5e1; transition: 0.1s; }
  .file-row:hover { background: #334155; color: #fff; }
</style>

<script>
  const chatBox = document.getElementById('chatBox');
  const aiInput = document.getElementById('aiInput');
  const sendBtn = document.getElementById('sendBtn');
  const modelSelect = document.getElementById('modelSelect');
  
  let currentFileId = null;
  let allFiles = [];
  let isLoaded = false;

  function openFileModal() {
    document.getElementById('fileModal').style.display = 'flex';
    if (!isLoaded) loadFiles();
  }

  function closeFileModal() {
    document.getElementById('fileModal').style.display = 'none';
  }

  async function loadFiles() {
    const container = document.getElementById('fileListContainer');
    container.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8;"><i class="bi bi-hourglass-split"></i> Loading files...</div>';
    try {
        const res = await fetch('/api/all_files');
        allFiles = await res.json();
        isLoaded = true;
        renderList(allFiles);
    } catch(e) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171;">Error loading files.</div>';
    }
  }

  function renderList(files) {
    const container = document.getElementById('fileListContainer');
    container.innerHTML = '';
    
    if (files.length === 0) {
      container.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8;">No files found.</div>';
      return;
    }

    files.forEach(f => {
      const row = document.createElement('div');
      row.className = 'file-row';
      
      const nameSpan = document.createElement('span');
      nameSpan.style.fontWeight = '500';
      nameSpan.innerHTML = '<i class="bi bi-file-earmark-text text-primary me-2"></i>' + f.name;
      
      const pathSpan = document.createElement('span');
      pathSpan.style.fontSize = '10px';
      pathSpan.style.color = '#64748b';
      pathSpan.textContent = f.path.length > 30 ? '...' + f.path.slice(-30) : f.path;

      row.appendChild(nameSpan);
      row.appendChild(pathSpan);

      // Attach click event safely
      row.onclick = function() {
          currentFileId = f.id;
          document.getElementById('fileName').textContent = f.name;
          document.getElementById('selectedFileBadge').style.display = 'block';
          closeFileModal();
      };

      container.appendChild(row);
    });
  }

  function filterFiles() {
    const q = document.getElementById('fileSearch').value.toLowerCase();
    renderList(allFiles.filter(f => f.name.toLowerCase().includes(q)));
  }

  function clearFile() {
    currentFileId = null;
    document.getElementById('selectedFileBadge').style.display = 'none';
  }

  function addMessage(text, sender) {
    const isBot = sender === 'bot';
    const msgHTML = `
      <div class="ai-message ai-${sender}">
        <div class="ai-avatar"><i class="bi bi-${isBot ? 'robot' : 'person-fill'}"></i></div>
        <div class="ai-text">${text}</div>
      </div>
    `;
    chatBox.insertAdjacentHTML('beforeend', msgHTML);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addTyping() {
    chatBox.insertAdjacentHTML('beforeend', `
      <div class="ai-message ai-bot" id="typingIndicator">
        <div class="ai-avatar"><i class="bi bi-robot"></i></div>
        <div class="ai-text"><span class="typing">|</span></div>
      </div>
    `);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendMessage() {
    const text = aiInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    aiInput.value = '';
    aiInput.disabled = true;
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    addTyping();

    const endpoint = currentFileId ? '/api/ai/chat_file' : '/api/ai/chat';
    const payload = { prompt: text, model: modelSelect.value };
    if (currentFileId) payload.file_id = currentFileId;

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      
      document.getElementById('typingIndicator')?.remove();
      
      if (data.ok) {
        addMessage(data.response, 'bot');
      } else {
        addMessage('❌ Error: ' + data.error, 'bot');
      }
    } catch (err) {
      document.getElementById('typingIndicator')?.remove();
      addMessage('❌ Network error. Is the server running?', 'bot');
    } finally {
      aiInput.disabled = false;
      sendBtn.disabled = false;
      sendBtn.innerHTML = '<i class="bi bi-send-fill"></i>';
      aiInput.focus();
    }
  }

  aiInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
  });
</script>
{% endblock %}
